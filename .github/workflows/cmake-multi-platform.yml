# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        cpp_compiler: [g++, clang++, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwxgtk3.2-dev \
          libcurl4-openssl-dev \
          libzip-dev \
          pkg-config

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        # Install vcpkg dependencies
        vcpkg install wxwidgets:x64-windows curl:x64-windows libzip:x64-windows
      shell: cmd

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    # Package for Linux (DEB)
    - name: Create DEB package (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}
        cpack -G DEB

    - name: Upload DEB artifacts (Ubuntu)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages-${{ matrix.cpp_compiler }}
        path: ${{ steps.strings.outputs.build-output-dir }}/*.deb
        if-no-files-found: error

    # Package for Windows (Portable ZIP with static dependencies)
    - name: Create Windows portable package
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p portable/TaxonomyTools

        # Copy executables
        cp ${{ steps.strings.outputs.build-output-dir }}/Release/*.exe portable/TaxonomyTools/ 2>/dev/null || \
        cp ${{ steps.strings.outputs.build-output-dir }}/*.exe portable/TaxonomyTools/

        # Copy required DLLs from vcpkg
        vcpkg_root="C:/vcpkg/installed/x64-windows"
        cp "$vcpkg_root/bin/"*.dll portable/TaxonomyTools/ 2>/dev/null || true

        # Copy Visual C++ Runtime (if needed)
        # The executables should be statically linked, but we include DLLs just in case

        # Create README
        cat > portable/TaxonomyTools/README.txt << 'EOF'
        TaxonomyTools Portable Edition
        ===============================

        This is a portable version of TaxonomyTools for Windows.
        Simply extract and run the executables:

        - TaxonomyDict.exe - Dictionary generator
        - TaxonomyTree.exe - Family tree visualizer

        No installation required!
        EOF

        # Create ZIP
        cd portable
        7z a ../TaxonomyTools-Windows-x64-Portable.zip TaxonomyTools/

    - name: Upload Windows portable artifacts
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: windows-portable
        path: TaxonomyTools-Windows-x64-Portable.zip
        if-no-files-found: error

  # Create release when a tag is pushed
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/debian-packages-g++/*.deb
            artifacts/windows-portable/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
